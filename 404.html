<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Appy Hour Studios</title>
  <link rel="stylesheet" href="/studio.css">
  <script>
    // Addresses are lowercase (/reroute/support.html); send /ReRoute/Support.html and the like there.
    (function () {
      var p = location.pathname, lower = p.toLowerCase();
      if (p !== lower) location.replace(lower + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand">Page not found</div></div></header>
  <main class="wrap"><p style="margin:28px 0">That page isn't here. Try the <a href="/">Appy Hour Studios home page</a>.</p></main>
</body>
</html>
